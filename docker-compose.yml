services:
  cell-mcp:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: cell-mcp-server:0.0.7
    container_name: cell-mcp-server
    ports:
      - "8080:8080"

    env_file:
      - .env
    # Environment variables
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://host.docker.internal:4318
      - BASE_PATH=/mcp/v1/cell
      # Default model configuration
      - DEFAULT_MODEL=${DEFAULT_MODEL:-auto}

      # API Keys (use Docker secrets in production)
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - XAI_API_KEY=${XAI_API_KEY}
      - DIAL_API_KEY=${DIAL_API_KEY}
      - DIAL_API_HOST=${DIAL_API_HOST}
      - DIAL_API_VERSION=${DIAL_API_VERSION}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - CUSTOM_API_URL=${CUSTOM_API_URL}
      - CUSTOM_API_KEY=${CUSTOM_API_KEY}
      - CUSTOM_MODEL_NAME=${CUSTOM_MODEL_NAME}

      # State Management for conversation persistence
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_AUTH=${REDIS_AUTH}
      - REDIS_TTL_SECONDS=${REDIS_TTL_SECONDS}

      # Logging configuration
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_MAX_SIZE=${LOG_MAX_SIZE:-10MB}
      - LOG_BACKUP_COUNT=${LOG_BACKUP_COUNT:-5}
      - LOG_LEVEL=DEBUG

      # Advanced configuration
      - DEFAULT_THINKING_MODE_THINKDEEP=${DEFAULT_THINKING_MODE_THINKDEEP:-high}
      - DISABLED_TOOLS=${DISABLED_TOOLS}
      - MAX_MCP_OUTPUT_TOKENS=${MAX_MCP_OUTPUT_TOKENS}

      # Server configuration
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - TZ=${TZ:-UTC}

    # Volumes for persistent data
    volumes:
      - ./logs:/opt/zen/logs
      - zen-mcp-config:/app/conf
      - /etc/localtime:/etc/localtime:ro

    # Network configuration
    networks:
      - cell-infra-network
    command: >
      --pass-environment
      --host=0.0.0.0
      --port=8080
      --debug
      --allow-origin "*"
      -- zen-mcp-server

    # Resource limits
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 256M
          cpus: "0.25"

    # Health check
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:8080/status >/dev/null || exit 1",
        ]

      interval: 10s
      timeout: 3s
      retries: 10

    # Restart policy
    restart: unless-stopped

    # Security
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
      - /app/tmp:noexec,nosuid,size=50m

# Named volumes
volumes:
  zen-mcp-config:
    driver: local

# Networks
networks:
  cell-infra-network:
    external: true
